<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 占位二维码：三个定位角 + 中心占位文案，替换真实公众号二维码后删除本文件 -->
  <rect width="256" height="256" rx="16" fill="#ffffff"/>

  <!-- 左上定位角 -->
  <g>
    <rect x="20" y="20" width="52" height="52" rx="4" fill="#08080c"/>
    <rect x="28" y="28" width="36" height="36" rx="2" fill="#ffffff"/>
    <rect x="36" y="36" width="20" height="20" rx="1" fill="#08080c"/>
  </g>

  <!-- 右上定位角 -->
  <g>
    <rect x="184" y="20" width="52" height="52" rx="4" fill="#08080c"/>
    <rect x="192" y="28" width="36" height="36" rx="2" fill="#ffffff"/>
    <rect x="200" y="36" width="20" height="20" rx="1" fill="#08080c"/>
  </g>

  <!-- 左下定位角 -->
  <g>
    <rect x="20" y="184" width="52" height="52" rx="4" fill="#08080c"/>
    <rect x="28" y="192" width="36" height="36" rx="2" fill="#ffffff"/>
    <rect x="36" y="200" width="20" height="20" rx="1" fill="#08080c"/>
  </g>

  <!-- 中心占位图标 -->
  <rect x="116" y="116" width="24" height="24" rx="6" fill="#08080c"/>
  <text x="128" y="104" font-family="sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle">二维码占位</text>
</svg>
